aid: work-bench
name: Work-Bench
description: >-
  Work-Bench is New York City's B2B software seed fund, founded in 2013, backing founders building the next
  generation of applied AI and infrastructure software. The firm leads pre-seed and seed rounds and works with
  founders on go-to-market from the first customers through scaling, under the thesis that "GTM is your moat".
  It is NYC-based and NYC-biased, but backs founders anywhere who want to win enterprise customers in New York.
  Its portfolio spans three areas, AI infrastructure and developer tools, cybersecurity, and enterprise apps and
  vertical AI, with exits including CoreOS (Red Hat), Semmle (GitHub), Tilt (Docker), Permiso (Okta) and
  FireHydrant (Freshworks). Headquartered at 915 Broadway, New York. It publishes the GTM Weekly newsletter.
